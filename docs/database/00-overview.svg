<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 700" width="1170" height="700"><rect width="1170" height="700" fill="#f5f7fa"/><g font-family="Arial, sans-serif" fill="#172b4d" font-size="16"><text x="24" y="40" font-size="24" font-weight="bold">Cơ sở dữ liệu quản lý quán cà phê</text><text x="24" y="70" fill="#50617b">37 bảng nghiệp vụ · 7 phân hệ · Bản phân nhóm, không biểu diễn khóa ngoại</text><g transform="translate(24,100)"><rect width="1120" height="68" rx="8" fill="white" stroke="#cbd5e1"/><text x="18" y="27" font-weight="bold">1. Tài khoản, phân quyền và nhân viên · 8 bảng</text><text x="18" y="51" font-size="12" fill="#50617b">Role, Account, Permission, RolePermission, AccountPermission, AccessAudit, Employee, EmployeeActivity</text></g><g transform="translate(24,182)"><rect width="1120" height="68" rx="8" fill="white" stroke="#cbd5e1"/><text x="18" y="27" font-weight="bold">2. Thực đơn và định lượng · 6 bảng</text><text x="18" y="51" font-size="12" fill="#50617b">FoodCategory, ItemType, Food, FoodVariant, FoodTopping, Recipe</text></g><g transform="translate(24,264)"><rect width="1120" height="68" rx="8" fill="white" stroke="#cbd5e1"/><text x="18" y="27" font-weight="bold">3. Nguyên liệu và tồn kho · 5 bảng</text><text x="18" y="51" font-size="12" fill="#50617b">IngredientGroup, Ingredient, IngredientUnit, StockLot, StockMovement</text></g><g transform="translate(24,346)"><rect width="1120" height="68" rx="8" fill="white" stroke="#cbd5e1"/><text x="18" y="27" font-weight="bold">4. Nhà cung cấp và chứng từ kho · 5 bảng</text><text x="18" y="51" font-size="12" fill="#50617b">Supplier, ImportReceipt, ImportDetail, WarehouseDocument, WarehouseDocumentLine</text></g><g transform="translate(24,428)"><rect width="1120" height="68" rx="8" fill="white" stroke="#cbd5e1"/><text x="18" y="27" font-weight="bold">5. Phòng bàn, đơn hàng và bếp · 8 bảng</text><text x="18" y="51" font-size="12" fill="#50617b">Area, TableFood, TableOperation, Bill, BillInfo, KitchenOrder, KitchenOrderDetail, QrOrderRequest</text></g><g transform="translate(24,510)"><rect width="1120" height="68" rx="8" fill="white" stroke="#cbd5e1"/><text x="18" y="27" font-weight="bold">6. Khách hàng và tích điểm · 3 bảng</text><text x="18" y="51" font-size="12" fill="#50617b">CustomerGroup, Customer, CustomerPointEntry</text></g><g transform="translate(24,592)"><rect width="1120" height="68" rx="8" fill="white" stroke="#cbd5e1"/><text x="18" y="27" font-weight="bold">7. Sổ quỹ và ca thu ngân · 2 bảng</text><text x="18" y="51" font-size="12" fill="#50617b">CashierShift, CashEntry</text></g></g></svg>